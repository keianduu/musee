<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artist Detail — Musee Prototype</title>
<link rel="stylesheet" href="./shared.css">
</head>
<body>
<header class="header">
  <div class="shell header-inner">
    <a class="logo" href="./index.html">Musee</a>
    <div class="top-actions"><span class="icon">●</span><span class="icon">MY</span></div>
  </div>
</header>
<main>
  <section class="shell page-head">
    <div class="status">Prototype scaffold</div>
    <div class="kicker">Artist</div>
    <h1>Artist Detail</h1>
    <p class="lead">アーティスト概要、開催中・開催予定展示、過去の開催履歴、保存、コンプリート導線を検討する画面です。</p>
  </section>
  
<section class="section">
  <div class="shell">
    <h2>Artist Profile</h2>
    <div class="placeholder"></div>
  </div>
</section>
<section class="section alt">
  <div class="shell">
    <h2>Where to see now</h2>
    <div class="card-grid"><div class="card"><strong>Now</strong><p>現在見られる展示。</p></div><div class="card"><strong>Upcoming</strong><p>開催予定。</p></div><div class="card"><strong>History</strong><p>過去の開催履歴。</p></div></div>
  </div>
</section>
<section class="section">
  <div class="shell">
    <h2>Your progress</h2>
    <div class="card"><strong>Artist Collection</strong><p>「あと1展でコンプリート」など将来のQuest体験。</p></div>
  </div>
</section>
</main>

<footer class="bottom-nav">

</html>
